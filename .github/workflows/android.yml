# Build + unit test ทุกครั้งที่ push / เปิด PR
# - ตรวจว่าโค้ด Kotlin compile ผ่าน และ unit test ผ่าน (รวม ScamClassifierTest ที่เทียบผลกับ Python)
# - ได้ไฟล์ APK รุ่น debug ไว้ลองบนมือถือ: หน้า Actions -> เลือก run -> Artifacts -> safe-debug-apk
# - ไม่มี firebase.properties บน CI -> build แบบไม่มีฐานข้อมูลชุมชน (ตั้งใจ ไม่ต้องใส่ secret)
name: Android CI

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # runner ของ GitHub (ubuntu-latest) มี Android SDK + license ติดตั้งไว้แล้ว (ANDROID_HOME)
      # AGP จะดาวน์โหลด platform ที่ขาดให้เอง

      # ตรวจว่า gradle-wrapper.jar ใน repo เป็นของแท้จาก Gradle (กันไฟล์ jar ถูกแก้)
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ถ้าแก้ Entity แล้วไม่ได้ commit ไฟล์ schema ใหม่ = อาจลืมเขียน migration -> ให้ fail
      - name: Check Room schema is committed
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            echo "::error::โครงสร้างฐานข้อมูลเปลี่ยน แต่ยังไม่ได้ commit ไฟล์ใน android/app/schemas/ (ดาวน์โหลดจาก artifact room-schemas) และอย่าลืมเพิ่ม version + migration ใน Database.kt"
            git status --porcelain -- app/schemas
            exit 1
          fi

      - name: Upload Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: android/app/schemas/
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: safe-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
