# ตรวจฝั่ง Python: เทรนโมเดลได้ และไฟล์ที่ส่งออกให้แอปตรงกับ scikit-learn (export_model.py จะ fail ถ้าไม่ตรง)
name: ML check

on:
  push:
    branches: [main]
    paths: ["ml/**", ".github/workflows/ml.yml"]
  pull_request:
    paths: ["ml/**", ".github/workflows/ml.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r requirements.txt
      - name: Train + export + parity check
        run: python train_model.py
      - name: Redaction + data merge pipeline tests
        run: python test_pipeline.py
